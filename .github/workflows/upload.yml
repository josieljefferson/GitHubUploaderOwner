# ============================================================
# 🚀 GITHUB UPLOADER
# ============================================================

name: 🚀 GitHub Uploader

on:

  workflow_dispatch:

    inputs:

      repository:
        description: "📦 Nome do repositório de destino. Exemplo: MEU-PROJETO"
        required: true
        type: string

      source:
        description: "📁 Arquivo ou pasta dentro de uploads/"
        required: true
        type: string

      create:
        description: "🆕 Criar o repositório se ele não existir"
        required: true
        type: boolean
        default: false

      private:
        description: "🔒 Criar o repositório como privado"
        required: true
        type: boolean
        default: false

      branch:
        description: "🌿 Branch de destino"
        required: true
        type: string
        default: "main"

      remote_dir:
        description: "📂 Subpasta no repositório. Vazio = raiz"
        required: false
        type: string
        default: ""

      commit:
        description: "📝 Mensagem do commit"
        required: true
        type: string
        default: "Upload automático"


jobs:

  upload:

    name: 📦 Upload para GitHub

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: 📥 Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # PYTHON
      # ======================================================

      - name: 🐍 Configurar Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: pip


      # ======================================================
      # DEPENDÊNCIAS
      # ======================================================

      - name: 📦 Instalar dependências

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          echo "✅ Dependências instaladas."


      # ======================================================
      # VERIFICAR ORIGEM
      # ======================================================

      - name: 🔎 Verificar origem

        env:
          SOURCE: ${{ inputs.source }}

        run: |

          echo "=============================================="
          echo "          VERIFICAÇÃO DA ORIGEM"
          echo "=============================================="
          echo

          echo "📁 Origem:"
          echo "$SOURCE"
          echo

          case "$SOURCE" in

            uploads/*)
              echo "✅ Origem dentro de uploads/"
              ;;

            *)
              echo "❌ ERRO: a origem precisa estar dentro de uploads/"
              exit 1
              ;;

          esac

          if [ ! -e "$SOURCE" ]; then

            echo "❌ ERRO: origem não encontrada:"
            echo "$SOURCE"
            echo

            if [ -d uploads ]; then
              find uploads -maxdepth 3 -print
            fi

            exit 1

          fi

          if [ -d "$SOURCE" ]; then
            echo "📂 Tipo: DIRETÓRIO"

          elif [ -f "$SOURCE" ]; then
            echo "📄 Tipo: ARQUIVO"

          fi

          echo
          echo "✅ Origem encontrada."


      # ======================================================
      # VERIFICAR SCRIPT
      # ======================================================

      - name: 🐍 Verificar GitHub Uploader

        run: |

          if [ ! -f scripts/github_uploader.py ]; then

            echo "❌ scripts/github_uploader.py não encontrado."

            if [ -d scripts ]; then
              find scripts -maxdepth 2 -type f -print
            fi

            exit 1

          fi

          echo "✅ Script encontrado."


      # ======================================================
      # TOKEN
      # ======================================================

      - name: 🔐 Verificar MY_GITHUB_TOKEN

        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

        run: |

          if [ -z "$MY_GITHUB_TOKEN" ]; then

            echo "❌ MY_GITHUB_TOKEN não encontrado."
            echo
            echo "Configure:"
            echo
            echo "Settings"
            echo "→ Secrets and variables"
            echo "→ Actions"
            echo "→ Repository secrets"
            echo "→ MY_GITHUB_TOKEN"

            exit 1

          fi

          echo "✅ MY_GITHUB_TOKEN encontrado."


      # ======================================================
      # DESCOBRIR OWNER AUTOMATICAMENTE
      # ======================================================

      - name: 👤 Descobrir owner autenticado

        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

        run: |

          python - <<'PY'

          import os
          import requests
          import sys

          token = os.environ["MY_GITHUB_TOKEN"]

          response = requests.get(
              "https://api.github.com/user",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "github-uploader"
              },
              timeout=60
          )

          if not response.ok:

              print(
                  "❌ Não foi possível descobrir "
                  "o proprietário autenticado."
              )

              print(
                  response.text
              )

              sys.exit(1)

          user = response.json()

          owner = user.get("login")

          if not owner:

              print(
                  "❌ GitHub não retornou o login."
              )

              sys.exit(1)

          print()
          print("==============================================")
          print("       👤 OWNER AUTENTICADO")
          print("==============================================")
          print()
          print(f"Owner: {owner}")
          print()
          print("==============================================")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:

              env_file.write(
                  f"GITHUB_UPLOAD_OWNER={owner}\n"
              )

          PY


      # ======================================================
      # MOSTRAR CONFIGURAÇÃO
      # ======================================================

      - name: 📋 Mostrar configuração

        env:
          REPOSITORY: ${{ inputs.repository }}
          SOURCE: ${{ inputs.source }}
          CREATE: ${{ inputs.create }}
          PRIVATE: ${{ inputs.private }}
          BRANCH: ${{ inputs.branch }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          COMMIT: ${{ inputs.commit }}

        run: |

          echo
          echo "=============================================="
          echo "       🚀 CONFIGURAÇÃO DO UPLOAD"
          echo "=============================================="
          echo

          echo "👤 Owner autenticado:"
          echo "$GITHUB_UPLOAD_OWNER"
          echo

          echo "📦 Repositório:"
          echo "$REPOSITORY"
          echo

          echo "📍 Destino:"
          echo "https://github.com/$GITHUB_UPLOAD_OWNER/$REPOSITORY"
          echo

          echo "📁 Origem:"
          echo "$SOURCE"
          echo

          echo "🆕 Criar:"
          echo "$CREATE"
          echo

          echo "🔒 Privado:"
          echo "$PRIVATE"
          echo

          echo "🌿 Branch:"
          echo "$BRANCH"
          echo

          echo "📂 Subpasta:"
          echo "${REMOTE_DIR:-"(raiz do repositório)"}"
          echo

          echo "📝 Commit:"
          echo "$COMMIT"

          echo
          echo "=============================================="


      # ======================================================
      # EXECUTAR UPLOAD
      # ======================================================

      - name: 🚀 Executar GitHub Uploader

        env:

          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

          SOURCE: ${{ inputs.source }}

          REPOSITORY: ${{ inputs.repository }}

          CREATE: ${{ inputs.create }}

          PRIVATE: ${{ inputs.private }}

          BRANCH: ${{ inputs.branch }}

          REMOTE_DIR: ${{ inputs.remote_dir }}

          COMMIT: ${{ inputs.commit }}

        run: |

          CMD_ARGS=()

          CMD_ARGS+=("$SOURCE")

          CMD_ARGS+=("--repo")
          CMD_ARGS+=("$REPOSITORY")


          if [ "$CREATE" = "true" ]; then
            CMD_ARGS+=("--create")
          fi


          if [ "$PRIVATE" = "true" ]; then
            CMD_ARGS+=("--private")
          fi


          CMD_ARGS+=("--branch")
          CMD_ARGS+=("$BRANCH")


          if [ -n "$REMOTE_DIR" ]; then

            CMD_ARGS+=("--remote-dir")
            CMD_ARGS+=("$REMOTE_DIR")

          fi


          CMD_ARGS+=("--commit")
          CMD_ARGS+=("$COMMIT")


          echo
          echo "=============================================="
          echo "          🚀 EXECUTANDO UPLOAD"
          echo "=============================================="
          echo

          python scripts/github_uploader.py "${CMD_ARGS[@]}"


      # ======================================================
      # RESULTADO
      # ======================================================

      - name: ✅ Resultado

        env:
          REPOSITORY: ${{ inputs.repository }}
          BRANCH: ${{ inputs.branch }}
          REMOTE_DIR: ${{ inputs.remote_dir }}

        run: |

          echo
          echo "=============================================="
          echo "          🎉 UPLOAD FINALIZADO"
          echo "=============================================="
          echo

          echo "👤 Owner:"
          echo "$GITHUB_UPLOAD_OWNER"
          echo

          echo "📦 Repositório:"
          echo "$REPOSITORY"
          echo

          echo "🌐 URL:"
          echo "https://github.com/$GITHUB_UPLOAD_OWNER/$REPOSITORY"
          echo

          echo "🌿 Branch:"
          echo "$BRANCH"
          echo

          if [ -n "$REMOTE_DIR" ]; then

            echo "📂 Subpasta:"
            echo "$REMOTE_DIR"

          else

            echo "📂 Localização:"
            echo "Raiz do repositório"

          fi

          echo
          echo "=============================================="
          echo "             🚀 CONCLUÍDO"
          echo "=============================================="
